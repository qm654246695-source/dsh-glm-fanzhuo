<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>饭桌群聊</title>
<style>
  :root { --bg:#0e1116; --panel:#151b23; --line:#22303c; --fg:#e6edf3; --dim:#8b98a6; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; display:flex; flex-direction:column; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.5px; }
  .chip { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  .chip b { font-weight:600; }
  #online { margin-left:auto; font-size:12px; color:var(--dim); }
  main { flex:1; overflow-y:auto; padding:18px 16px 8px; }
  .msg { display:flex; gap:10px; margin:0 0 14px; align-items:flex-start; }
  .who { width:64px; flex:0 0 64px; text-align:right; font-size:12px; color:var(--dim); padding-top:6px; }
  .bubble { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 12px; max-width:min(760px,calc(100% - 90px)); white-space:pre-wrap; word-break:break-word; }
  .msg.user .who { color:#9be7a0; }
  .msg.user .bubble { background:#16221c; border-color:#22402e; }
  .msg.system .bubble { background:#241a1a; border-color:#4a2b2b; color:#ffb4b4; }
  .time { font-size:11px; color:#5f6b78; margin-left:8px; }
  .thinking { color:var(--dim); font-size:12px; padding:2px 0 10px 74px; }
  footer { padding:10px 16px 14px; border-top:1px solid var(--line); background:var(--panel); }
  form { display:flex; gap:10px; }
  input[type=text] { flex:1; background:#0d1319; border:1px solid var(--line); color:var(--fg); border-radius:10px; padding:10px 12px; font-size:15px; outline:none; }
  input[type=text]:focus { border-color:#2f4b5e; }
  button { background:#1d6e52; border:1px solid #29825f; color:#eafff5; border-radius:10px; padding:10px 18px; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { color:var(--dim); font-size:12px; margin-top:6px; }
  .shout { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .shout-btn { background:transparent; border:1px solid var(--line); color:var(--dim); border-radius:999px; padding:4px 12px; font-size:12px; cursor:pointer; }
  .shout-btn:disabled { opacity:.4; cursor:default; }
</style>
</head>
<body>
<header>
  <h1>饭桌群聊</h1>
  <span class="chip" id="m-feiyu">肥鱼</span>
  <span class="chip" id="m-glm">GLM · 本地 9B</span>
  <span id="online">连接中…</span>
</header>
<main id="log"></main>
<footer>
  <form id="f">
    <input id="text" type="text" placeholder="说点什么…（@肥鱼 或 @GLM 可以只叫一个人）" autocomplete="off" />
    <button id="send">发送</button>
  </form>
  <div class="hint">回车发送 · 不 @ 的时候三个人轮着接话（每轮换先手）· 记录落在 H:\GLM\group-chat\room.jsonl</div>
  <div id="shout" class="shout"></div>
</footer>
<script>
const log = document.getElementById('log');
const online = document.getElementById('online');
const form = document.getElementById('f');
const input = document.getElementById('text');
const sendBtn = document.getElementById('send');
const thinking = new Map();
const COLORS = {};

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function hhmm(t) { const d = new Date(t); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function atBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 80; }

function addMsg(m) {
  const stick = atBottom();
  const box = el('div', 'msg ' + (m.from === '用户' ? 'user' : m.from === '系统' ? 'system' : ''));
  const who = el('div', 'who', m.from);
  if (COLORS[m.from]) who.style.color = COLORS[m.from];
  const bubble = el('div', 'bubble', m.text);
  bubble.appendChild(el('span', 'time', hhmm(m.t)));
  box.append(who, bubble);
  log.appendChild(box);
  if (stick) log.scrollTop = log.scrollHeight;
}
function setThinking(name, on) {
  if (on) thinking.set(name, true); else thinking.delete(name);
  let row = document.getElementById('think-row');
  if (!thinking.size) { if (row) row.remove(); return; }
  if (!row) { row = el('div', 'thinking'); row.id = 'think-row'; log.appendChild(row); }
  row.textContent = [...thinking.keys()].join('、') + ' 正在想…';
  if (atBottom()) log.scrollTop = log.scrollHeight;
}

const es = new EventSource('events');
es.onopen = () => { online.textContent = '已连上'; };
es.onerror = () => { online.textContent = '断线重连中…'; };
es.addEventListener('msg', (e) => addMsg(JSON.parse(e.data)));
es.addEventListener('thinking', (e) => { const d = JSON.parse(e.data); setThinking(d.name, true); });
es.addEventListener('idle', (e) => { const d = JSON.parse(e.data); setThinking(d.name, false); });

fetch('state').then(r => r.json()).then(s => {
  const shout = document.getElementById('shout');
  for (const m of s.members) {
    COLORS[m.name] = m.color;
    const chip = document.getElementById('m-' + m.id);
    if (chip) { chip.style.color = m.color; chip.innerHTML = '<b>' + m.name + '</b>' + (m.model ? ' · ' + m.model : ''); }
    if (shout) {
      const b = el('button', 'shout-btn', '喊 ' + m.name);
      b.type = 'button';
      b.style.borderColor = m.color;
      b.style.color = m.color;
      b.addEventListener('click', async () => {
        b.disabled = true;
        try { await fetch('nudge', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ member: m.id }) }); }
        finally { b.disabled = false; }
      });
      shout.appendChild(b);
    }
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  try {
    await fetch('say', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
  } finally { sendBtn.disabled = false; input.focus(); }
});
input.focus();
</script>
</body>
</html>
